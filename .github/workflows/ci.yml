name: TicketSystem CI and GHCR

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

  workflow_dispatch:

# 默认情况下，工作流只能读取仓库内容
permissions:
  contents: read

# 同一分支连续推送时，取消旧的未完成任务
concurrency:
  group: ticketsystem-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

  # 例如：your-name/TicketSystem
  # metadata-action 会将镜像名称转换成小写
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------
  # 1. Maven 单元测试 + 集成测试
  # -------------------------------------------------------
  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: user_center_test
          MYSQL_USER: ticket_ci
          MYSQL_PASSWORD: ci_mysql_password
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uticket_ci -pci_mysql_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:3
        env:
          RABBITMQ_DEFAULT_USER: ticket_ci
          RABBITMQ_DEFAULT_PASS: ci_rabbit_password
        ports:
          - "5672:5672"
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run unit and integration tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/user_center_test?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: ticket_ci
          SPRING_DATASOURCE_PASSWORD: ci_mysql_password

          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: 6379

          SPRING_RABBITMQ_HOST: 127.0.0.1
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: ticket_ci
          SPRING_RABBITMQ_PASSWORD: ci_rabbit_password

          JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-characters
        run: ./mvnw -B -ntp -Pintegration-test clean verify

  # -------------------------------------------------------
  # 2. PR 只验证 Dockerfile，不推送镜像
  # -------------------------------------------------------
  docker-build:
    name: Validate Docker image
    if: github.event_name == 'pull_request'
    needs:
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ticketsystem:pr-${{ github.event.pull_request.number }}

  # -------------------------------------------------------
  # 3. master 测试通过后推送 GHCR
  # -------------------------------------------------------
  publish-image:
    name: Publish image to GHCR
    if: github.event_name == 'push'
    needs:
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 只有这个 job 有推送 Package 的权限
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image digest
        run: echo "Image digest is ${{ steps.push.outputs.digest }}"