spring:
  application:
    name: TicketSystem
  profiles:
    default: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
# springdoc 配置
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 开启驼峰命名映射（user_name -> userName）
    map-underscore-to-camel-case: true
    # 开发阶段开启 SQL 日志，方便调试
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      # 主键策略：雪花算法自动生成
      id-type: assign_id
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: ${SERVER_PORT:8080}
# 日志级别

logging:
  level:
    com.example.ticketsystem: INFO
    #info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

jwt:
  secret: my-ticket-system-secret-key-must-be-at-least-32-chars-long!!
  expiration: ${JWT_EXPIRATION_MS:86400000}

ticket:
  sla:
    check-interval-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ticket-system