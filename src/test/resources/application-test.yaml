spring:
  datasource:
    url: ${TEST_DATASOURCE_URL:jdbc:mysql://localhost:3306/user_center_test?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true}
    username: ${TEST_DATASOURCE_USERNAME:root}
    password: ${TEST_DATASOURCE_PASSWORD:123456}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${TEST_REDIS_HOST:localhost}
      port: ${TEST_REDIS_PORT:6379}
  rabbitmq:
    host: ${TEST_RABBITMQ_HOST:localhost}
    port: ${TEST_RABBITMQ_PORT:5672}
    username: ${TEST_RABBITMQ_USERNAME:guest}
    password: ${TEST_RABBITMQ_PASSWORD:guest}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: WARN
    com.example.ticketsystem: INFO
jwt:
  secret: test-secret-key-must-be-at-least-32-characters-long!!
  expiration: 86400000